services:
  gateway:
    build: ./services/Gateway-service
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth
      - exchange

  exchange:
    build:
      context: .
      dockerfile: services/Exchange/Dockerfile

  auth:
    build: ./services/Auth-service
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting the stack}
    depends_on:
      - account

  account:
    build: ./services/Account-service
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    volumes:
      - exchange-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "store", "-d", "store"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  exchange-db:
