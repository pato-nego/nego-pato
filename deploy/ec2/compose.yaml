x-java: &java
  image: eclipse-temurin:25-jre
  command: ["java", "-jar", "/app.jar"]
  restart: unless-stopped

services:
  ingress:
    profiles: [gateway]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]

  gateway:
    <<: *java
    profiles: [gateway]
    environment:
      ACCOUNT_URL: http://account:8081
      AUTH_URL: http://auth:8080
      EXCHANGE_URL: http://exchange:8000
      PRODUCT_URL: http://product:8080
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/etc/gateway/routes.yaml
    extra_hosts:
      auth: ${IDENTITY_IP:-127.0.0.1}
      account: ${IDENTITY_IP:-127.0.0.1}
      exchange: ${EXCHANGE_IP:-127.0.0.1}
      product: ${PRODUCT_IP:-127.0.0.1}
    volumes:
      - ./artifacts/gateway.jar:/app.jar:ro
      - ./gateway-routes.yaml:/etc/gateway/routes.yaml:ro

  auth:
    <<: *java
    profiles: [identity]
    ports: ["8080:8080"]
    mem_limit: 768m
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    volumes:
      - ./artifacts/auth.jar:/app.jar:ro
    depends_on: [account]

  account:
    <<: *java
    profiles: [identity]
    ports: ["8081:8080"]
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DATABASE_HOST:-localhost}:5432/store?sslmode=verify-full&sslrootcert=/rds-ca.pem
      SPRING_DATASOURCE_USERNAME: account_app
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD:-}
    volumes:
      - ./artifacts/account.jar:/app.jar:ro
      - ./rds-ca.pem:/rds-ca.pem:ro

  exchange:
    profiles: [exchange]
    build:
      context: ../..
      dockerfile: services/Exchange/Dockerfile
    restart: unless-stopped
    ports: ["8000:8000"]

  product:
    <<: *java
    profiles: [product]
    ports: ["8080:8080"]
    mem_limit: 1200m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DATABASE_HOST:-localhost}:5432/product?sslmode=verify-full&sslrootcert=/rds-ca.pem
      SPRING_DATASOURCE_USERNAME: product_app
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD:-}
      REDIS_HOST: redis
    volumes:
      - ./artifacts/product.jar:/app.jar:ro
      - ./rds-ca.pem:/rds-ca.pem:ro
    depends_on: [redis]

  redis:
    profiles: [product]
    image: redis:8-alpine
    restart: unless-stopped

volumes:
  caddy-data:
    name: pato-nego_caddy-data
    external: true
  caddy-config:
    name: pato-nego_caddy-config
    external: true
