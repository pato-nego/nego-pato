name: pato-nego

services:
  gateway:
    build: ./gateway-service
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth
      - exchange
      - product
      - order

  exchange:
    build:
      context: .
      dockerfile: exchange/Dockerfile

  auth:
    build: ./auth-service
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting the stack}
    depends_on:
      - account

  account:
    build: ./account-service
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
    depends_on:
      db:
        condition: service_healthy

  product:
    build: ./product
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
      REDIS_HOST: redis
      SPRING_CACHE_TYPE: ${PRODUCT_CACHE_TYPE:-redis}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  order:
    build: ./order-service
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: store
      DATABASE_USERNAME: store
      DATABASE_PASSWORD: store
    depends_on:
      db:
        condition: service_healthy
      product:
        condition: service_started
      exchange:
        condition: service_started

  redis:
    image: redis:7-alpine

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
    volumes:
      - exchange-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "store", "-d", "store"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  exchange-db:
