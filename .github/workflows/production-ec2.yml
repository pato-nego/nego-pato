name: Production EC2 release

on:
  push:
    branches: [main]
    paths:
      - api/exchange
      - api/gateway-service
      - .github/deploy-ec2.sh
      - .github/workflows/production-ec2.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      GATEWAY_INSTANCE_ID: ${{ vars.EC2_GATEWAY_INSTANCE_ID }}
      EXCHANGE_INSTANCE_ID: ${{ vars.EC2_EXCHANGE_INSTANCE_ID }}
      GATEWAY_URL: ${{ vars.EC2_GATEWAY_URL }}
      PRODUCT_IP: ${{ vars.EC2_PRODUCT_PRIVATE_IP }}
      ORDER_IP: ${{ vars.EC2_ORDER_PRIVATE_IP }}
      RELEASE_BUCKET: ${{ vars.EC2_RELEASE_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build the pinned releases
        run: |
          mvn -B -ntp -f api/gateway-service/pom.xml package
          cp api/gateway-service/target/gateway-service-*.jar "$RUNNER_TEMP/gateway.jar"
          docker build -t exchange:ci api/exchange
          docker run --rm \
            --mount "type=bind,source=$PWD/api/exchange/test_rates.py,target=/app/exchange/test_rates.py,readonly" \
            exchange:ci .venv/bin/python -m unittest test_rates
          docker save exchange:ci | gzip > "$RUNNER_TEMP/exchange-image.tar.gz"
          for release in gateway exchange; do
            install -m 755 .github/deploy-ec2.sh "$RUNNER_TEMP/deploy-ec2.sh"
            if [[ "$release" == gateway ]]; then
              artifact=gateway.jar
            else
              artifact=exchange-image.tar.gz
            fi
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$release.tar.gz" deploy-ec2.sh "$artifact"
          done
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.EC2_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1
      - name: Deploy Exchange, then Gateway, through Systems Manager
        run: |
          set -euo pipefail
          ipv4='^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          [[ "$PRODUCT_IP" =~ $ipv4 && "$ORDER_IP" =~ $ipv4 ]]
          deploy() {
            local service=$1 instance=$2 archive key checksum url parameters command command_id
            archive="$RUNNER_TEMP/$service.tar.gz"
            key="releases/$GITHUB_SHA/$GITHUB_RUN_ATTEMPT/$service.tar.gz"
            checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)
            aws s3api put-object --bucket "$RELEASE_BUCKET" --key "$key" --body "$archive" >/dev/null
            url=$(aws s3 presign "s3://$RELEASE_BUCKET/$key" --expires-in 900)
            printf -v command '%s\n' \
              'set -eu' 'stage=$(mktemp -d)' 'trap '\''rm -r -- "$stage"'\'' EXIT' 'cd "$stage"' \
              "curl -fsS --retry 2 --connect-timeout 6 --max-time 50 '$url' -o release.tar.gz" \
              "echo '$checksum  release.tar.gz' | sha256sum -c -" 'tar -xzf release.tar.gz' \
              "bash deploy-ec2.sh '$service' '$PRODUCT_IP' '$ORDER_IP'"
            parameters=$(jq -cn --arg command "$command" '{commands: [$command], executionTimeout: ["180"]}')
            command_id=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
              --comment "Pato Nego $service $GITHUB_SHA" --timeout-seconds 210 \
              --parameters "$parameters" --query Command.CommandId --output text)
            if ! aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" 2>/dev/null; then
              aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance" 2>/dev/null || true
            fi
            result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance")
            jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
            test "$(jq -r .Status <<< "$result")" = Success
          }
          deploy exchange "$EXCHANGE_INSTANCE_ID"
          deploy gateway "$GATEWAY_INSTANCE_ID"
          curl -fsS --max-time 8 "$GATEWAY_URL/exchange/health-check"
          for path in /products /orders /exchange/USD/BRL; do
            status=$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' "$GATEWAY_URL$path")
            test "$status" = 401
          done
