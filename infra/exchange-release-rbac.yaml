apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exchange-release
  namespace: pato-nego
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [exchange]
    verbs: [get, list, watch, patch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [exchange-config]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [exchange]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: exchange-release
  namespace: pato-nego
subjects:
  - kind: Group
    name: exchange-releasers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: exchange-release
  apiGroup: rbac.authorization.k8s.io
