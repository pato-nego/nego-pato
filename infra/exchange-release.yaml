AWSTemplateFormatVersion: '2010-09-09'
Description: Exchange GitHub Actions release through a private EKS deploy job
Parameters:
  Vpc: {Type: 'AWS::EC2::VPC::Id'}
  PrivateSubnet: {Type: 'AWS::EC2::Subnet::Id'}
  ClusterFirewall: {Type: 'AWS::EC2::SecurityGroup::Id'}
Resources:
  DeployFirewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Exchange deploy job outbound access
      VpcId: !Ref Vpc
  ApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterFirewall
      SourceSecurityGroupId: !Ref DeployFirewall
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
  DeployLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/pato-nego-exchange-deploy
      RetentionInDays: 7
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnEquals:
                'aws:SourceArn': !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/pato-nego-exchange-deploy
      Policies:
        - PolicyName: DeployExchange
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DeployLogs.Arn
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/pato-nego
              - Effect: Allow
                Action: ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/pato-nego/exchange
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DeleteNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeDhcpOptions, ec2:DescribeSecurityGroups, ec2:DescribeSubnets, ec2:DescribeVpcs]
                Resource: '*'
              - Effect: Allow
                Action: ec2:CreateNetworkInterfacePermission
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                Condition:
                  StringEquals: {'ec2:AuthorizedService': codebuild.amazonaws.com}
                  ArnEquals: {'ec2:Subnet': !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${PrivateSubnet}'}
  ClusterAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: pato-nego
      PrincipalArn: !GetAtt DeployRole.Arn
      KubernetesGroups: [exchange-releasers]
  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pato-nego-exchange-deploy
      ServiceRole: !GetAtt DeployRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 10
      QueuedTimeoutInMinutes: 10
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: REGISTRY
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
      VpcConfig:
        VpcId: !Ref Vpc
        Subnets: [!Ref PrivateSubnet]
        SecurityGroupIds: [!Ref DeployFirewall]
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
                  digest=$(aws ecr describe-images --repository-name pato-nego/exchange --image-ids "imageTag=$RELEASE_SHA" --query 'imageDetails[0].imageDigest' --output text)
                  [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                  head=$(git ls-remote https://github.com/pato-nego/Exchange.git refs/heads/main | cut -f1)
                  test "$head" = "$RELEASE_SHA"
                  curl -fsSL --retry 3 "https://raw.githubusercontent.com/pato-nego/Exchange/$RELEASE_SHA/k8s/k8s.yaml" -o k8s.yaml
                  printf 'resources: [k8s.yaml]\nimages:\n  - name: pato-nego/exchange\n    newName: %s\n    digest: %s\n' "$REGISTRY/pato-nego/exchange" "$digest" > kustomization.yaml
                  aws eks update-kubeconfig --name pato-nego
                  kubectl -n pato-nego apply --server-side --field-manager=pato-manifests -k .
                  kubectl -n pato-nego rollout status deployment/exchange --timeout=180s
                  test "$(kubectl -n pato-nego get deployment exchange -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$REGISTRY/pato-nego/exchange@$digest"
  GitHubRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:pato-nego@317014205/Exchange@1412079538:ref:refs/heads/main
      Policies:
        - PolicyName: PublishExchange
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:DescribeImages, ecr:BatchGetImage, ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/pato-nego/exchange
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt Project.Arn
Outputs:
  GitHubRoleArn: {Value: !GetAtt GitHubRole.Arn}
  DeployProject: {Value: !Ref Project}
